name: Test Action

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: nimbus-action-test-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test-action:
    name: GitHub Actions Test
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy test service
        id: deploy
        uses: ./
        with:
          api-key: ${{ secrets.NIMBUS_API_KEY }}
          nimbus-server: ${{ secrets.NIMBUS_HOST_PRAYUJ }}
          nimbus-path: nimbus.yaml
          tag-images: 'false'
          pr-comment: 'false'

      - name: Verify the deployed HTTP response
        env:
          SERVICE_URLS: ${{ steps.deploy.outputs.service-urls }}
        run: |
          url=$(jq -er '."http-test"[0] | select(type == "string" and startswith("https://"))' <<< "$SERVICE_URLS")
          response=$(curl --fail --silent --show-error --retry 30 --retry-delay 5 --retry-all-errors --max-time 10 "$url")
          test "$response" = 'Hello from Nimbus!'

      - name: Remove test resources
        if: always()
        env:
          TEST_BRANCH: ${{ github.ref_name }}
          NIMBUS_SERVER: ${{ secrets.NIMBUS_HOST_PRAYUJ }}
          NIMBUS_API_KEY: ${{ secrets.NIMBUS_API_KEY }}
          NIMBUS_PATH: nimbus.yaml
        run: |
          jq -n --arg branch "$TEST_BRANCH" '{ref_type: "branch", ref: $branch}' > "$RUNNER_TEMP/nimbus-delete.json"
          GITHUB_EVENT_NAME=delete GITHUB_EVENT_PATH="$RUNNER_TEMP/nimbus-delete.json" bash ./entrypoint.sh
