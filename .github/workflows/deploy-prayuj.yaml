name: Test Action

on: [push, delete]

concurrency:
  group: nimbus-action-test-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'delete' }}

jobs:
  test-action:
    name: GitHub Actions Test
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Test Nimbus Action
        id: test-action-prayuj
        uses: ./
        with:
          api-key: ${{ secrets.NIMBUS_API_KEY }}
          nimbus-server: ${{ secrets.NIMBUS_HOST_PRAYUJ }}
          nimbus-path: nimbus.yaml
